server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: auth
    password: auth
  jpa:
    hibernate:
      ddl-auto: update        # dev only; switch to Flyway later
rsa:
  public-key: classpath:certs/public.pem
  private-key: classpath:certs/private.pem
app:
  google-client-id: ${GOOGLE_CLIENT_ID:changeme.apps.googleusercontent.com}
  access-token-minutes: 15
  refresh-token-days: 7
  cookie-secure: false        # true in production (HTTPS)